    <!--
      Structured data. Deliberately lives in the static HTML rather than being
      injected by React, so it stays readable without executing JavaScript.

      alternateName carries the spellings people actually type. Search engines
      use them to resolve different queries to the same entity, which is the
      main lever for ranking on personal-name searches.

      Keep in sync with src/data/profile.ts.
    -->
    <script type="application/ld+json">
      {

        "@graph": [

            "@id": "https://sajib.dev.cv/#person",

              "Sajib Miah",

            "image": "https://avatars.githubusercontent.com/u/85227514?v=4",
            "email": "mailto:sajeeb.web@gmail.com",
